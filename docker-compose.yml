version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridfinity
      POSTGRES_USER: gridfinity
      POSTGRES_PASSWORD: gridfinity_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridfinity"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gridfinity
      DB_USER: gridfinity
      DB_PASSWORD: gridfinity_pw
      PORT: 3333
      # QR code payload format:
      #   url  → "https://host/bin/42"  (works in any camera app; ties stickers to host)
      #   id   → "gfbin:42"             (host-portable; only the in-app scanner decodes it)
      QR_PAYLOAD_MODE: ${QR_PAYLOAD_MODE:-url}
      # Backup / restore configuration — see backend/backup.js for details.
      BACKUP_DIR: /backups
      # Seeds app_settings on first boot only — same pattern as QR_PAYLOAD_MODE.
      # After that, Settings → Database → Backup in the UI is the source of
      # truth; changing it there takes effect immediately, no restart needed.
      BACKUP_INTERVAL_DAYS: ${BACKUP_INTERVAL_DAYS:-7}    # 0 disables the recurring dump
      BACKUP_RETAIN: 5           # max number of dumps kept
      # Restore by setting on the command line:
      #   RESTORE_FROM=gridfinity-2026-05-15T18-30-45Z.sql docker compose up -d backend
      # Marker file prevents accidental re-restore on subsequent restarts.
      RESTORE_FROM: ${RESTORE_FROM:-}
      # Login / sessions — see backend/server.js and README "User accounts".
      # Set this to a long random string, e.g. `openssl rand -hex 32`.
      # Without it, a random secret is generated on every start and every
      # restart logs everyone out.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Set to "true" once the app is served over HTTPS (see "Camera & HTTPS"
      # below) so session cookies get the Secure flag. Leave false for plain
      # HTTP on your LAN.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # No admin account env vars — the first visit to the app prompts you
      # to create the admin account interactively. Additional accounts come
      # from that admin (Settings → Access → Users) or self-service sign-up
      # on the login screen (always created as read-only 'viewer').
    volumes:
      - ./backups:/backups
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────
  # OPTIONAL — HTTPS reverse proxy.
  #
  # Required only if you want the in-app QR scanner (Scan tab) to
  # work on a phone: iOS Safari / Chrome only grant camera access
  # on secure origins.
  #
  # To enable:
  #   1) Uncomment the `caddy:` block and the two `caddy_*` volumes
  #      at the bottom of this file.
  #   2) `docker compose up -d` — Caddy starts on :443 with a
  #      self-signed cert (Caddy's internal CA).
  #   3) Visit https://<host-ip>/ on your phone and accept the
  #      cert warning the first time, OR install Caddy's root CA
  #      for a warning-free experience.
  #
  # See README "Camera & HTTPS" for the mkcert recipe and the
  # Tailscale alternative (zero-config HTTPS over your tailnet).
  # ──────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
