<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridfinity Organizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="bg-slate-50 text-gray-900 min-h-screen">

<!-- ══════════════════════════════════════════════════════════
     PRINT AREA (hidden, only visible on print)
══════════════════════════════════════════════════════════ -->
<div id="print-area"></div>

<!-- ══════════════════════════════════════════════════════════
     ROOT
══════════════════════════════════════════════════════════ -->
<div id="root"></div>

<!-- ══════════════════════════════════════════════════════════
     QR MODAL
══════════════════════════════════════════════════════════ -->
<div id="qr-overlay" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-xs">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-gray-800" id="qr-title">QR Code</h3>
      <button onclick="App.closeQr()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div id="qr-box" class="flex justify-center mb-3"></div>
    <p class="text-xs text-gray-400 text-center break-all mb-4" id="qr-url"></p>
    <div class="flex gap-2">
      <button onclick="App.printQr()" class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-50">🖨 Print</button>
      <button onclick="App.closeQr()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm hover:bg-blue-700">Close</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     GENERIC MODAL
══════════════════════════════════════════════════════════ -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-40 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col">
    <div class="flex justify-between items-center px-6 pt-5 pb-3 border-b border-gray-100 flex-shrink-0">
      <h2 class="text-lg font-bold text-gray-900" id="modal-title"></h2>
      <button onclick="App.closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div id="modal-body" class="overflow-y-auto px-6 py-4 flex-1"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     TOAST
══════════════════════════════════════════════════════════ -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50
     bg-gray-900 text-white text-sm px-5 py-2.5 rounded-full shadow-xl pointer-events-none"></div>

<!-- ══════════════════════════════════════════════════════════
     APP SCRIPTS — load order matters (no module system).
     core defines globals, app defines the App namespace,
     each view file extends App via Object.assign.
══════════════════════════════════════════════════════════ -->
<script src="/js/core.js"></script>
<script src="/js/app.js"></script>
<script src="/js/views/inventory.js"></script>
<script src="/js/views/locations.js"></script>
<script src="/js/views/box-types.js"></script>
<script src="/js/views/search.js"></script>
<script src="/js/views/bin-scan.js"></script>
<script src="/js/views/bin-form.js"></script>
<script src="/js/views/drawer-map.js"></script>
<script src="/js/views/qr.js"></script>
<script>App.init().catch(console.error);</script>

</body>
</html>
