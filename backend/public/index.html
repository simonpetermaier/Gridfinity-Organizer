<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridfinity Organizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/main.css">
  <script>
    // Apply theme before first paint to avoid FOUC, then mark as ready so transitions kick in.
    (function () {
      var saved = localStorage.getItem('gridfinity:theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var t = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      window.addEventListener('DOMContentLoaded', function () {
        document.documentElement.dataset.themeReady = '1';
      });
    })();
  </script>
</head>
<body>

<div id="print-area"></div>
<div id="root"></div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title"></h2>
      <button class="modal-close" onclick="App.closeModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="qr-overlay" class="modal-overlay hidden">
  <div class="modal qr-modal">
    <div class="modal-header">
      <h2 class="modal-title" id="qr-title">QR Code</h2>
      <button class="modal-close" onclick="App.closeQr()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" style="text-align:center;">
      <div id="qr-box" style="display:flex; justify-content:center; margin-bottom:12px;"></div>
      <p class="mute" id="qr-url" style="font-size:var(--text-xs); word-break:break-all; margin: 0 0 12px;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeQr()">Close</button>
      <button class="btn btn-primary" onclick="App.printQr()">Print</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/core.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/app.js"></script>
<script src="/js/views/inventory.js"></script>
<script src="/js/views/locations.js"></script>
<script src="/js/views/box-types.js"></script>
<script src="/js/views/content-types.js"></script>
<script src="/js/views/search.js"></script>
<script src="/js/views/bin-scan.js"></script>
<script src="/js/views/bin-form.js"></script>
<script src="/js/views/drawer-map.js"></script>
<script src="/js/views/qr.js"></script>
<script>App.init().catch(console.error);</script>

</body>
</html>
