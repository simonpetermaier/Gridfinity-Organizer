<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridfinity Organizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* ── Grid visualisation ──────────────────────────── */
    .gc { width:46px; height:46px; border:1px solid #d1d5db; cursor:pointer;
          position:relative; box-sizing:border-box; transition:background .1s; }
    .gc:hover   { background:#f0f9ff; }
    .gc.empty   { background:#fff; }
    .gc.occ     { background:#3b82f6; border-color:#2563eb; }
    .gc.sel     { background:#10b981; border-color:#059669; }
    .gc.conflict{ background:#ef4444; border-color:#dc2626; }
    .gc.preview { background:#a7f3d0; border-color:#10b981; }
    .gc.hover-ok{ background:#bbf7d0; border-color:#22c55e; }
    .bin-lbl { font-size:7px; line-height:1.2; position:absolute; inset:2px;
               overflow:hidden; color:#fff; pointer-events:none; font-weight:600; }

    /* ── Tab underline ───────────────────────────────── */
    .tab-btn { border-bottom:2px solid transparent; }
    .tab-btn.active { border-bottom-color:#3b82f6; color:#2563eb; font-weight:600; }

    /* ── Scrollbar thin ──────────────────────────────── */
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#f1f5f9; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:#94a3b8; }

    /* ── Animations ──────────────────────────────────── */
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    .fade-in { animation: fadeIn .15s ease; }

    /* ── Print QR ────────────────────────────────────── */
    @media print {
      body > *:not(#print-area) { display:none !important; }
      #print-area { display:block !important; }
    }
    #print-area { display:none; }
  </style>
</head>
<body class="bg-slate-50 text-gray-900 min-h-screen">

<!-- ══════════════════════════════════════════════════════════
     PRINT AREA (hidden, only visible on print)
══════════════════════════════════════════════════════════ -->
<div id="print-area"></div>

<!-- ══════════════════════════════════════════════════════════
     ROOT
══════════════════════════════════════════════════════════ -->
<div id="root"></div>

<!-- ══════════════════════════════════════════════════════════
     QR MODAL
══════════════════════════════════════════════════════════ -->
<div id="qr-overlay" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-xs">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-gray-800" id="qr-title">QR Code</h3>
      <button onclick="App.closeQr()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div id="qr-box" class="flex justify-center mb-3"></div>
    <p class="text-xs text-gray-400 text-center break-all mb-4" id="qr-url"></p>
    <div class="flex gap-2">
      <button onclick="App.printQr()" class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-50">🖨 Print</button>
      <button onclick="App.closeQr()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm hover:bg-blue-700">Close</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     GENERIC MODAL
══════════════════════════════════════════════════════════ -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-40 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col">
    <div class="flex justify-between items-center px-6 pt-5 pb-3 border-b border-gray-100 flex-shrink-0">
      <h2 class="text-lg font-bold text-gray-900" id="modal-title"></h2>
      <button onclick="App.closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div id="modal-body" class="overflow-y-auto px-6 py-4 flex-1"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     TOAST
══════════════════════════════════════════════════════════ -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50
     bg-gray-900 text-white text-sm px-5 py-2.5 rounded-full shadow-xl pointer-events-none"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function toast(msg, ms = 2000) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), ms);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════
// API CLIENT
// ═══════════════════════════════════════════════════════════════
const api = {
  async req(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch('/api' + path, opts);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
  },
  get:    p        => api.req('GET',    p),
  post:   (p, b)   => api.req('POST',   p, b),
  put:    (p, b)   => api.req('PUT',    p, b),
  delete: p        => api.req('DELETE', p),
};

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const S = {
  tab:           'inventory',   // inventory | locations | box-types | search
  locations:     [],
  boxTypes:      [],
  bins:          [],
  locFilter:     '',
  typeFilter:    '',
  searchQ:       '',
  searchResults: [],
  // grid picker state (shared for add/edit bin modals)
  grid: {
    locId:      null,
    locData:    null,
    drawerBins: [],
    selX:       null,
    selY:       null,
    hoverX:     null,
    hoverY:     null,
    bw:         1,    // bin width in grid units
    bl:         1,    // bin length in grid units
    editId:     null, // bin being edited (excluded from collision map)
  },
  // QR print buffer
  qrBin: null,
};

// ═══════════════════════════════════════════════════════════════
// BIN COLOUR PALETTE  (for drawer map)
// ═══════════════════════════════════════════════════════════════
const PALETTE = [
  '#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899',
  '#06b6d4','#f97316','#84cc16','#e11d48','#0ea5e9',
];
const binColor = id => PALETTE[id % PALETTE.length];

// ═══════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════
const App = {

  // ── bootstrap ──────────────────────────────────────────────
  async init() {
    // Check if we're on the /bin/:id scan page
    const m = window.location.pathname.match(/^\/bin\/(\d+)$/);
    if (m) { await this.renderBinScan(m[1]); return; }

    await Promise.all([this.loadLocations(), this.loadBoxTypes(), this.loadBins()]);
    this.render();
  },

  async loadLocations() { S.locations = await api.get('/locations'); },
  async loadBoxTypes()  { S.boxTypes  = await api.get('/box-types'); },
  async loadBins()      { S.bins      = await api.get('/bins'); },

  // ── main render ────────────────────────────────────────────
  render() {
    $('root').innerHTML = `
      <div class="min-h-screen flex flex-col">
        ${this.renderHeader()}
        <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6 fade-in">
          ${this.renderTab()}
        </main>
      </div>`;
  },

  renderHeader() {
    const tabs = [
      { id:'inventory',  icon:'📦', label:'Inventory'  },
      { id:'locations',  icon:'🗄️',  label:'Drawers'    },
      { id:'box-types',  icon:'📐', label:'Box Types'  },
      { id:'search',     icon:'🔍', label:'Search'     },
    ];
    return `
      <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
          <span class="text-2xl">🗄️</span>
          <div>
            <div class="font-bold text-gray-900 leading-tight">Gridfinity Organizer</div>
            <div class="text-xs text-gray-400">Workshop inventory system</div>
          </div>
          <span class="ml-auto text-xs text-gray-400">${S.bins.length} bins · ${S.locations.length} drawers</span>
        </div>
        <div class="max-w-7xl mx-auto px-4 flex gap-0 overflow-x-auto">
          ${tabs.map(t => `
            <button onclick="App.switchTab('${t.id}')"
              class="tab-btn px-5 py-2.5 text-sm text-gray-500 hover:text-blue-600 whitespace-nowrap transition-colors ${S.tab===t.id?'active':''}">
              ${t.icon} ${t.label}
            </button>`).join('')}
        </div>
      </header>`;
  },

  renderTab() {
    switch (S.tab) {
      case 'inventory': return this.renderInventory();
      case 'locations': return this.renderLocations();
      case 'box-types': return this.renderBoxTypes();
      case 'search':    return this.renderSearch();
    }
  },

  switchTab(tab) { S.tab = tab; this.render(); },

  // ══════════════════════════════════════════════════════════
  // INVENTORY TAB
  // ══════════════════════════════════════════════════════════
  renderInventory() {
    const filtered = this.filteredBins();
    return `
      <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
        <h2 class="text-lg font-semibold">Inventory
          <span class="ml-2 text-sm font-normal text-gray-400">${filtered.length} / ${S.bins.length} bins</span>
        </h2>
        <button onclick="App.showAddBin()"
          class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 flex items-center gap-1.5">
          <span class="text-lg leading-none">+</span> Add Bin
        </button>
      </div>

      <div class="flex flex-wrap gap-2 mb-4">
        <select onchange="S.locFilter=this.value;App.render()"
          class="border border-gray-200 bg-white rounded-lg px-3 py-2 text-sm text-gray-700">
          <option value="" ${!S.locFilter?'selected':''}>All Locations</option>
          ${S.locations.map(l=>`<option value="${l.id}" ${S.locFilter==l.id?'selected':''}>${esc(l.cabinet_id)} / ${esc(l.drawer_id)}</option>`).join('')}
        </select>
        <select onchange="S.typeFilter=this.value;App.render()"
          class="border border-gray-200 bg-white rounded-lg px-3 py-2 text-sm text-gray-700">
          <option value="" ${!S.typeFilter?'selected':''}>All Types</option>
          ${[...new Set(S.bins.map(b=>b.content_type).filter(Boolean))].sort().map(t=>`<option value="${esc(t)}" ${S.typeFilter===t?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
        ${S.locFilter||S.typeFilter?`<button onclick="S.locFilter='';S.typeFilter='';App.render()" class="text-xs text-blue-600 hover:underline px-2">Clear filters</button>`:''}
      </div>

      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-100">
              <tr>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide w-16">ID</th>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Location</th>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Pos</th>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Box Type</th>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Type</th>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Attribute</th>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide w-12">H</th>
                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
              ${filtered.length ? filtered.map(b => `
                <tr class="hover:bg-slate-50 transition-colors group">
                  <td class="px-3 py-2.5">
                    <span class="font-mono font-bold text-blue-600 text-sm">#${b.id}</span>
                  </td>
                  <td class="px-3 py-2.5 text-gray-600 text-xs">
                    ${b.cabinet_id ? `<div class="font-medium text-gray-800">${esc(b.cabinet_id)}</div><div class="text-gray-400">${esc(b.drawer_id)}</div>` : '<span class="text-gray-300">—</span>'}
                  </td>
                  <td class="px-3 py-2.5 font-mono text-xs text-gray-400">
                    ${b.grid_x!=null ? `(${b.grid_x},${b.grid_y})` : '—'}
                  </td>
                  <td class="px-3 py-2.5 text-xs text-gray-500">${esc(b.box_type_name||'—')}</td>
                  <td class="px-3 py-2.5">
                    ${b.content_type ? `<span class="inline-block bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full text-xs font-medium">${esc(b.content_type)}</span>` : '<span class="text-gray-300 text-xs">—</span>'}
                  </td>
                  <td class="px-3 py-2.5 font-medium text-gray-800">${esc(b.attribute||'—')}</td>
                  <td class="px-3 py-2.5 text-xs text-gray-400">${b.height_u}U</td>
                  <td class="px-3 py-2.5">
                    <div class="flex gap-0.5 opacity-60 group-hover:opacity-100 transition-opacity">
                      <button onclick="App.showQr(${b.id})" title="QR Code" class="p-1.5 rounded hover:bg-blue-50 hover:text-blue-600">📱</button>
                      <button onclick="App.showEditBin(${b.id})" title="Edit" class="p-1.5 rounded hover:bg-green-50 hover:text-green-600">✏️</button>
                      <button onclick="App.deleteBin(${b.id})" title="Remove" class="p-1.5 rounded hover:bg-red-50 hover:text-red-600">🗑️</button>
                    </div>
                  </td>
                </tr>`).join('') : `
                <tr><td colspan="8" class="px-4 py-12 text-center text-gray-400">
                  No bins match the current filters.
                </td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;
  },

  filteredBins() {
    let bins = S.bins;
    if (S.locFilter)  bins = bins.filter(b => String(b.location_id) === String(S.locFilter));
    if (S.typeFilter) bins = bins.filter(b => b.content_type === S.typeFilter);
    return bins;
  },

  // ══════════════════════════════════════════════════════════
  // LOCATIONS TAB
  // ══════════════════════════════════════════════════════════
  renderLocations() {
    return `
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-lg font-semibold">Drawers & Cabinets
          <span class="ml-2 text-sm font-normal text-gray-400">${S.locations.length} entries</span>
        </h2>
        <button onclick="App.showAddLocation()"
          class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">
          + Add Drawer
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        ${S.locations.length ? S.locations.map(loc => {
          const binCount = S.bins.filter(b => b.location_id === loc.id).length;
          return `
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-3">
              <div>
                <div class="font-bold text-gray-900">${esc(loc.cabinet_id)}</div>
                <div class="text-sm text-blue-600 font-medium">${esc(loc.drawer_id)}</div>
              </div>
              <div class="flex gap-0.5">
                <button onclick="App.showDrawerMap(${loc.id})" title="View grid map"
                  class="p-1.5 rounded hover:bg-blue-50 hover:text-blue-600 text-gray-400">🗺️</button>
                <button onclick="App.showEditLocation(${loc.id})" title="Edit"
                  class="p-1.5 rounded hover:bg-green-50 hover:text-green-600 text-gray-400">✏️</button>
                <button onclick="App.deleteLocation(${loc.id})" title="Delete"
                  class="p-1.5 rounded hover:bg-red-50 hover:text-red-600 text-gray-400">🗑️</button>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center text-xs mb-3">
              <div class="bg-slate-50 rounded-lg py-2">
                <div class="font-bold text-gray-800 text-sm">${loc.grid_columns}×${loc.grid_rows}</div>
                <div class="text-gray-400">Grid</div>
              </div>
              <div class="bg-slate-50 rounded-lg py-2">
                <div class="font-bold text-gray-800 text-sm">${loc.vertical_space_u}U</div>
                <div class="text-gray-400">Height</div>
              </div>
              <div class="bg-slate-50 rounded-lg py-2">
                <div class="font-bold text-gray-800 text-sm">${binCount}</div>
                <div class="text-gray-400">Bins</div>
              </div>
            </div>
            ${loc.attributes ? `<div class="text-xs text-gray-400 italic">${esc(loc.attributes)}</div>` : ''}
          </div>`;
        }).join('') : `
          <div class="col-span-3 py-16 text-center text-gray-400">
            <div class="text-5xl mb-3">🗄️</div>
            No drawers yet. Add your first drawer!
          </div>`}
      </div>`;
  },

  // ══════════════════════════════════════════════════════════
  // BOX TYPES TAB
  // ══════════════════════════════════════════════════════════
  renderBoxTypes() {
    return `
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-lg font-semibold">Box Types
          <span class="ml-2 text-sm font-normal text-gray-400">${S.boxTypes.length} types</span>
        </h2>
        <button onclick="App.showAddBoxType()"
          class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">
          + Add Box Type
        </button>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-100">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Name</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Footprint</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Height</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Divided</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Description</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
              ${S.boxTypes.length ? S.boxTypes.map(bt => `
                <tr class="hover:bg-slate-50 group">
                  <td class="px-4 py-3 font-semibold text-gray-900">${esc(bt.name)}</td>
                  <td class="px-4 py-3 font-mono text-gray-600">${bt.grid_width}×${bt.grid_length}</td>
                  <td class="px-4 py-3 text-gray-600">${bt.grid_height_u}U</td>
                  <td class="px-4 py-3">
                    ${bt.is_divided
                      ? `<span class="text-green-600 font-medium">✓ ${bt.compartments} comp.</span>`
                      : `<span class="text-gray-300">—</span>`}
                  </td>
                  <td class="px-4 py-3 text-gray-400 text-xs">${esc(bt.description||'—')}</td>
                  <td class="px-4 py-3">
                    <div class="flex gap-0.5 opacity-60 group-hover:opacity-100">
                      <button onclick="App.showEditBoxType(${bt.id})" class="p-1.5 rounded hover:bg-green-50 hover:text-green-600">✏️</button>
                      <button onclick="App.deleteBoxType(${bt.id})" class="p-1.5 rounded hover:bg-red-50 hover:text-red-600">🗑️</button>
                    </div>
                  </td>
                </tr>`).join('') : `
                <tr><td colspan="6" class="px-4 py-12 text-center text-gray-400">No box types yet.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;
  },

  // ══════════════════════════════════════════════════════════
  // SEARCH TAB
  // ══════════════════════════════════════════════════════════
  renderSearch() {
    return `
      <div class="max-w-2xl mx-auto mb-6">
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-lg">🔍</span>
          <input id="search-inp" type="search" placeholder="Search type, attribute, location, notes…"
            value="${esc(S.searchQ)}"
            oninput="App.handleSearch(this.value)"
            class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm bg-white">
        </div>
      </div>

      ${S.searchQ ? `
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <div class="px-4 py-2 bg-gray-50 border-b text-xs text-gray-500">
            ${S.searchResults.length} result${S.searchResults.length!==1?'s':''} for <strong>"${esc(S.searchQ)}"</strong>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b border-gray-100">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">ID</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Location</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Type</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Attribute</th>

    this._searchTimer = setTimeout(async () => {
      S.searchResults = await api.get('/bins/search?q=' + encodeURIComponent(q));

      // restore focus
      const inp = $('search-inp');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }, 280);
  },

    S.grid = { locId:b.location_id, locData:null, drawerBins:[], selX:b.grid_x, selY:b.grid_y,
               bw: b.grid_width||1, bl: b.grid_length||1, editId: id };

  onBinBtChange() {
    const sel = $('f-btype');
    const opt = sel.options[sel.selectedIndex];
    if (opt.value) {
      S.grid.bw = parseInt(opt.dataset.w) || 1;
      S.grid.bl = parseInt(opt.dataset.l) || 1;
      $('f-hu').value = opt.dataset.h || 3;
    } else { S.grid.bw = 1; S.grid.bl = 1; }
    this._renderGridPicker();
  },

  async onBinLocChange() {
    const locId = $('f-loc')?.value;
    if (!locId) {
      S.grid.locId = null; S.grid.locData = null; S.grid.drawerBins = [];
      S.grid.selX = null; S.grid.selY = null;
      this._renderGridPicker(); return;
    }
    S.grid.locId   = parseInt(locId);
    S.grid.locData = S.locations.find(l=>l.id===parseInt(locId));
    S.grid.drawerBins = await api.get('/locations/' + locId + '/bins');
    this._renderGridPicker();
  },

  _renderGridPicker() {
    const area = $('grid-area');
    if (!area) return;
    const g = S.grid;

    if (!g.locData) {
      area.innerHTML = `<p class="text-xs text-gray-400 italic mt-1">Select a drawer to see the grid and place the bin.</p>`;
      return;
    }

    const { grid_columns: cols, grid_rows: rows } = g.locData;

    // Build occupancy map (skip the bin we're editing)
    const occ = {};
    for (const b of g.drawerBins) {
      if (String(b.id) === String(g.editId)) continue;
      for (let dy=0; dy < (b.grid_length||1); dy++)
        for (let dx=0; dx < (b.grid_width||1); dx++)
          occ[`${b.grid_x+dx},${b.grid_y+dy}`] = b;
    }

    // Compute conflict for currently selected position
    const inSel = (c, r) =>
      g.selX != null && c >= g.selX && c < g.selX+g.bw && r >= g.selY && r < g.selY+g.bl;

    const hasConflict = () => {
      if (g.selX == null) return false;
      for (let dy=0; dy<g.bl; dy++)
        for (let dx=0; dx<g.bw; dx++)
          if (occ[`${g.selX+dx},${g.selY+dy}`]) return true;
      return false;
    };

    let tableRows = '';
    for (let r=0; r<rows; r++) {
      let cells = '';
      for (let c=0; c<cols; c++) {
        const key = `${c},${r}`;
        const occupier = occ[key];
        const selected = inSel(c,r);
        let cls = 'gc';
        let inner = '';

        if (occupier && !selected) {
          cls += ' occ';
          inner = `<span class="bin-lbl">#${occupier.id} ${esc(occupier.attribute||occupier.content_type||'')}</span>`;
        } else if (selected) {
          cls += occupier ? ' conflict' : ' sel';
        }

        cells += `<td class="${cls}" 
          onclick="App._gridClick(${c},${r})"
          onmouseenter="App._gridHover(${c},${r})"
          title="(col ${c}, row ${r})${occupier?' · #'+occupier.id+' '+( occupier.attribute||''):''}"
        >${inner}</td>`;
      }
      tableRows += `<tr>${cells}</tr>`;
    }

    const conflict = hasConflict();
    area.innerHTML = `
      <div class="text-xs text-gray-500 mb-2 flex items-center gap-3 flex-wrap">
        <span>Click to place the bin's top-left corner</span>
        ${g.selX!=null ? `<span class="font-mono bg-slate-100 px-2 py-0.5 rounded">pos: (${g.selX}, ${g.selY}) · ${g.bw}×${g.bl} cells</span>` : ''}
        ${conflict ? `<span class="text-red-500 font-medium">⚠ Position conflict!</span>` : ''}
      </div>
      <div class="overflow-x-auto rounded-lg border-2 border-gray-300 inline-block max-w-full">
        <table class="border-collapse">${tableRows}</table>
      </div>
      <div class="mt-2 flex gap-4 text-xs text-gray-400">
        <span><span class="inline-block w-3 h-3 bg-blue-500 rounded-sm mr-1"></span>Occupied</span>
        <span><span class="inline-block w-3 h-3 bg-emerald-500 rounded-sm mr-1"></span>Selected</span>
        <span><span class="inline-block w-3 h-3 bg-red-400 rounded-sm mr-1"></span>Conflict</span>
      </div>`;
  },

  _gridClick(c, r) {
    S.grid.selX = c; S.grid.selY = r;
    this._renderGridPicker();
  },
  _gridHover(c, r) { /* future: live preview */ },

  async saveBin(id) {
    const g = S.grid;
    const locId  = $('f-loc').value;
    const btId   = $('f-btype').value;

    // Conflict check
    if (locId && g.selX != null && g.drawerBins.length) {
      const occ = {};
      for (const b of g.drawerBins) {
        if (String(b.id) === String(id)) continue;
        for (let dy=0; dy<(b.grid_length||1); dy++)
          for (let dx=0; dx<(b.grid_width||1); dx++)
            occ[`${b.grid_x+dx},${b.grid_y+dy}`] = true;
      }
      for (let dy=0; dy<g.bl; dy++)
        for (let dx=0; dx<g.bw; dx++)
          if (occ[`${g.selX+dx},${g.selY+dy}`]) {
            alert('⚠ Position conflict with an existing bin. Please choose a different grid position.');
            return;
          }
    }

    const data = {
      location_id:  locId  ? parseInt(locId)  : null,
      grid_x:       g.selX,
      grid_y:       g.selY,
      grid_width:   g.bw,
      grid_length:  g.bl,
      height_u:     parseInt($('f-hu').value) || 3,
      box_type_id:  btId   ? parseInt(btId)   : null,
      content_type: $('f-ctype').value.trim(),
      attribute:    $('f-attr').value.trim(),
      notes:        $('f-notes').value.trim(),
    };
    try {
      if (id) await api.put('/bins/' + id, data);
      else    await api.post('/bins', data);
      await this.loadBins();
      this.closeModal();
      this.render();
      toast(id ? 'Bin updated ✓' : 'Bin created ✓');
    } catch (e) { alert('Error: ' + e.message); }
  },

  async deleteBin(id) {
    if (!confirm(`Remove bin #${id} from inventory?`)) return;
    await api.delete('/bins/' + id);
    await this.loadBins();
    this.render();
    toast('Bin removed');
  },

  // ══════════════════════════════════════════════════════════
  // DRAWER MAP
  // ══════════════════════════════════════════════════════════
  async showDrawerMap(locId) {
    const loc  = S.locations.find(l=>l.id===locId);
    const bins = await api.get('/locations/' + locId + '/bins');
    const { grid_columns: cols, grid_rows: rows } = loc;

    // Build per-bin colour map
    const colorMap = {};
    bins.forEach((b, i) => { colorMap[b.id] = PALETTE[i % PALETTE.length]; });

    // Build occupancy: key → { bin, isOrigin }
    const occ = {};
    for (const b of bins) {
      for (let dy=0; dy<(b.grid_length||1); dy++)
        for (let dx=0; dx<(b.grid_width||1); dx++) {
          const k = `${b.grid_x+dx},${b.grid_y+dy}`;
          occ[k] = { bin:b, isOrigin: dx===0 && dy===0 };
        }
    }

    let tableRows = '';
    for (let r=0; r<rows; r++) {
      let cells = '';
      for (let c=0; c<cols; c++) {
        const e = occ[`${c},${r}`];
        if (e) {
          const col = colorMap[e.bin.id];
          const lbl = e.isOrigin
            ? `<div class="text-white text-center pointer-events-none" style="font-size:8px;line-height:1.3;padding:2px;font-weight:600;">#${e.bin.id}<br>${esc(e.bin.attribute||e.bin.content_type||'')}</div>`
            : '';
          cells += `<td style="width:52px;height:52px;background:${col};border:1px solid rgba(0,0,0,0.15);cursor:pointer;position:relative;vertical-align:top;"
            onclick="App.closeModal();App.showQr(${e.bin.id})"
            title="#${e.bin.id} · ${esc(e.bin.attribute||'')} · ${esc(e.bin.content_type||'')}"
          >${lbl}</td>`;
        } else {
          cells += `<td style="width:52px;height:52px;border:1px solid #e2e8f0;background:#f8fafc;"
            title="(${c},${r})"></td>`;
        }
      }
      tableRows += `<tr>${cells}</tr>`;
    }

    this.openModal(`Drawer Map — ${esc(loc.cabinet_id)} / ${esc(loc.drawer_id)}`, `
      <div class="text-xs text-gray-400 mb-3">${cols}×${rows} grid · max ${loc.vertical_space_u}U · ${bins.length} bin${bins.length!==1?'s':''} placed</div>
      <div class="overflow-x-auto mb-4">
        <table class="border-collapse" style="border:2px solid #374151;">${tableRows}</table>
      </div>
      ${bins.length ? `
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Legend</div>
        <div class="grid grid-cols-2 gap-1.5">
          ${bins.map(b=>`
            <div class="flex items-center gap-2 text-sm">
              <span style="width:14px;height:14px;background:${colorMap[b.id]};border-radius:3px;flex-shrink:0;"></span>
              <span class="font-mono text-gray-400 text-xs">#${b.id}</span>
              <span class="font-medium text-gray-700 truncate">${esc(b.attribute||b.content_type||'—')}</span>
            </div>`).join('')}
        </div>` : `<p class="text-gray-400 text-sm">No bins placed in this drawer yet.</p>`}
      <div class="flex justify-end mt-6 pt-4 border-t border-gray-100">
        <button onclick="App.closeModal()" class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">Close</button>
      </div>`);
  },

  // ══════════════════════════════════════════════════════════
  // QR CODE
  // ══════════════════════════════════════════════════════════
  _qrBin: null,
  async showQr(id) {
    const bin = S.bins.find(b=>b.id===id) || await api.get('/bins/'+id);
    this._qrBin = bin;
    const url = `${window.location.origin}/bin/${id}`;
    $('qr-title').textContent = `Bin #${id} · ${bin.attribute || bin.content_type || 'No label'}`;
    $('qr-url').textContent   = url;
    $('qr-box').innerHTML     = '';
    $('qr-overlay').classList.remove('hidden');
    new QRCode($('qr-box'), {
      text: url, width:200, height:200,
      colorDark:'#1e40af', colorLight:'#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  },

  closeQr() { $('qr-overlay').classList.add('hidden'); },

  printQr() {
    const b   = this._qrBin;
    const url = `${window.location.origin}/bin/${b.id}`;
    const pa  = $('print-area');
    pa.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;padding:16px;font-family:sans-serif;">
        <div style="font-size:22px;font-weight:bold;margin-bottom:4px;">#${b.id} · ${b.attribute||b.content_type||''}</div>
        <div style="font-size:12px;color:#555;margin-bottom:12px;">${b.cabinet_id||''} / ${b.drawer_id||''}</div>
        <div id="print-qr-inner"></div>
        <div style="font-size:9px;color:#999;margin-top:8px;">${url}</div>
      </div>`;
    new QRCode(pa.querySelector('#print-qr-inner'), {
      text: url, width:180, height:180,
      colorDark:'#000', colorLight:'#fff',
      correctLevel: QRCode.CorrectLevel.M,
    });
    setTimeout(() => window.print(), 300);
  },
};

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
App.init().catch(console.error);
</script>
</body>
</html>
